services:
  # Postgres for CustomerService
  postgres-customer:
    image: postgres:15
    container_name: customer_service_db
    environment:
      POSTGRES_USER: ${CUSTOMER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      POSTGRES_DB: ${CUSTOMER_DB_NAME}
    volumes:
      - customer_service_data:/var/lib/postgresql/data
    ports:
      - "${CUSTOMER_DB_PORT}:5432"

  # Customer Service
  customer-service:
    build: ./customer-service
    container_name: customer_service
    depends_on:
      - postgres-customer
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${CUSTOMER_DB_HOST}:5432/${CUSTOMER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${CUSTOMER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-service:9093
    ports:
      - "${CUSTOMER_SERVICE_PORT}:8081"

  # Postgres for NotificationService
  postgres-notification:
    image: postgres:15
    container_name: notification_service_db
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    volumes:
      - notification_service_data:/var/lib/postgresql/data
    ports:
      - "${NOTIFICATION_DB_PORT}:5432"

  # Notification Service
  notification-service:
    build: ./notification-service
    container_name: notification_service
    depends_on:
      - postgres-notification
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${NOTIFICATION_DB_HOST}:5432/${NOTIFICATION_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-service:9093
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8082"

  # Zookeeper Service
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    restart: always
    ports:
      - "22181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: yes

  # Kafka Service
  kafka-service:
    image: bitnami/kafka:3.5
    container_name: kafka-service
    restart: always
    depends_on:
      - zookeeper # Ensure Zookeeper starts first
    ports:
      - "29092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT_INTERNAL://:9093,PLAINTEXT_EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka-service:9093,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CFG_BROKER_ID: 1
      ALLOW_PLAINTEXT_LISTENER: yes

volumes:
  customer_service_data:
  notification_service_data: